# IP de bind das portas publicadas de Mongo/Redis (LAB_BIND_IP). O valor
# padrão 192.168.22.250 é um IP ESTÁTICO DELIBERADO do laboratório (server01)
# — não é configuração acidental nem falha de segurança. Em outro host,
# sobrescreva com LAB_BIND_IP=<ip-do-host>. Os serviços continuam alcançáveis
# pela rede interna do Compose pelos nomes "mongodb"/"redis" independente
# desse bind.

x-backbet-env: &backbet-env
  NODE_ENV: production
  BACKBET_RUNTIME_ENV: production
  PORT: "3000"

  USE_MONGOOSE_PERSISTENCE: "true"
  MONGODB_URI: "${MONGODB_URI:?Defina MONGODB_URI no .env}"
  MONGODB_DB_NAME: "${MONGODB_DB_NAME:-backbet}"

  REDIS_URL: "${REDIS_URL:?Defina REDIS_URL no .env}"
  USE_REDIS_QUEUE: "true"

  JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
  JWT_ISSUER: "${JWT_ISSUER:-backbet}"
  JWT_EXPIRATION: "${JWT_EXPIRATION:-15m}"
  JWT_REFRESH_EXPIRATION: "${JWT_REFRESH_EXPIRATION:-7d}"
  ALLOW_DEV_BEARER_BYPASS: "${ALLOW_DEV_BEARER_BYPASS:-false}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}"
  ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"

  GAME_COINFLIP_ENABLED: "${GAME_COINFLIP_ENABLED:-false}"
  PIX_PROVIDER: "${PIX_PROVIDER:-mock}"
  PIX_ENABLE_DEPOSITS: "${PIX_ENABLE_DEPOSITS:-true}"
  PIX_ENABLE_WITHDRAWALS: "${PIX_ENABLE_WITHDRAWALS:-true}"
  PIX_DEFAULT_KEY: "${PIX_DEFAULT_KEY:-pix@backbet.mock}"
  PIX_WEBHOOK_ENABLED: "${PIX_WEBHOOK_ENABLED:-true}"
  PIX_WEBHOOK_SECRET: "${PIX_WEBHOOK_SECRET:-backbet-mock-webhook-secret}"
  PIX_CHARGE_TTL_MS: "${PIX_CHARGE_TTL_MS:-300000}"

  LOG_LEVEL: "${LOG_LEVEL:-info}"
  AUDIT_ENABLED: "true"

  OBS_ENABLE_PROMETHEUS: "${OBS_ENABLE_PROMETHEUS:-false}"
  TRACING_ENABLED: "${TRACING_ENABLED:-false}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}"
  OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-backbet-backend}"

x-worker-env: &worker-env
  <<: *backbet-env
  LOG_FILE_ENABLED: "false"

services:

  mongodb:
    image: mongo:7
    ports:
      - "${LAB_BIND_IP:-192.168.22.250}:27018:27017"
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD no .env}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-backbet}"
      MONGO_INITDB_APP_USERNAME: "${MONGODB_APP_USER:-backbet}"
      MONGO_INITDB_APP_PASSWORD: "${MONGODB_APP_PASSWORD:?Defina MONGODB_APP_PASSWORD no .env}"
      MONGO_INITDB_TEST_USERNAME: "${MONGODB_TEST_USER:-backbet-test}"
      MONGO_INITDB_TEST_PASSWORD: "${MONGODB_TEST_PASSWORD:?Defina MONGODB_TEST_PASSWORD no .env}"
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
      - ./deploy/mongo/mongodb-keyfile:/etc/mongodb-keyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand({ ping: 1 }).ok"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: "${MONGO_ROOT_USER:-admin}"
      MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD no .env}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        URI="mongodb://$${MONGO_ROOT_USER}:$${MONGO_ROOT_PASSWORD}@mongodb:27017/admin?authSource=admin"

        # --- Aguarda o MongoDB aceitar conexões (no primeiro boot, o entrypoint
        # do mongo reinicia o mongod após configurar auth — janela de ECONNREFUSED).
        attempt_repl_state() {
          mongosh "$${URI}" --quiet --eval \
            'try { db.adminCommand({ replSetGetStatus: 1 }).myState } catch (e) { 0 }' 2>/dev/null || true
        }

        echo "Aguardando MongoDB aceitar conexões autenticadas..."
        i=0
        while [ "$$i" -lt 60 ]; do
          if [ -n "$$(attempt_repl_state)" ]; then
            break
          fi
          i=$$((i + 1))
          sleep 2
        done

        state=$$(attempt_repl_state)

        if [ "$${state}" = "1" ]; then
          echo "Replica set rs0 já está PRIMARY."
          exit 0
        fi

        echo "Inicializando replica set rs0..."

        mongosh "$${URI}" --quiet --eval \
          "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] })" || true

        echo "Aguardando MongoDB se tornar PRIMARY..."

        i=0
        while [ "$$i" -lt 60 ]; do
          state=$$(attempt_repl_state)

          if [ "$${state}" = "1" ]; then
            echo "Replica set rs0 está PRIMARY."
            exit 0
          fi

          i=$$((i + 1))
          sleep 2
        done

        echo "Erro: MongoDB não se tornou PRIMARY."
        exit 1

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}"
    ports:
      - "${LAB_BIND_IP:-192.168.22.250}:6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  backbet:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: backbet:latest
    restart: unless-stopped
    env_file:
      - .env
    environment: *backbet-env
    ports:
      - "${BACKBET_PORT:-3000}:3000"
    volumes:
      - backbet_logs:/usr/src/app/logs
      - backbet_uploads:/usr/src/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  withdrawal-worker:
    image: backbet:latest
    restart: unless-stopped
    command: ["node", "dist/scripts/start-withdrawal-worker.js"]
    env_file:
      - .env
    environment: *worker-env
    depends_on:
      redis:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  contact-worker:
    image: backbet:latest
    restart: unless-stopped
    command: ["node", "dist/scripts/start-contact-worker.js"]
    env_file:
      - .env
    environment: *worker-env
    depends_on:
      redis:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  integration-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    image: backbet:test
    restart: "no"
    init: true
    environment:
      NODE_ENV: test
      BACKBET_RUNTIME_ENV: test
      MONGODB_URI: "${MONGODB_URI:?Defina MONGODB_URI no .env}"
      MONGODB_TEST_URI: "${MONGODB_TEST_URI:?Defina MONGODB_TEST_URI no .env}"
      MONGODB_TEST_DB: "${MONGODB_TEST_DB:-backbet-test}"
      REDIS_URL: "${REDIS_URL:?Defina REDIS_URL no .env}"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
    depends_on:
      redis:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully

volumes:
  mongodb_data:
  redis_data:
  backbet_logs:
  backbet_uploads:
