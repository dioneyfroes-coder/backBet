name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard de segredos (nenhum segredo no Git — Fase 26)
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests com cobertura
        run: npx jest --maxWorkers=2 --coverage

      - name: Linter
        run: npm run lint

      # Gate duro da Fase 27: nenhuma vulnerabilidade CRÍTICA nas dependências
      # de produção. Moderadas/altas conhecidas: docs/DEPLOY.mdx.
      - name: Scan de dependências (audit crítico - produção)
        run: npm run audit:prod:critical

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  integration:
    runs-on: ubuntu-latest

    # Fase 18/28 — Ambiente de testes reproduzível: a suíte de integração real
    # (MongoDB replica set + Redis) roda DENTRO da rede do docker-compose.test.yml
    # (serviço `integration-tests`). O CI não injeta MONGODB_URI/REDIS_URL nem
    # depende de localhost/127.0.0.1/IP do host: o replica set é anunciado como
    # `mongodb:27017` e o Redis como `redis:6379`, ambos resolvíveis pela rede
    # interna do Compose.
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (backbet:test)
        run: docker compose -f docker-compose.test.yml build integration-tests

      - name: Run real integration tests (container network)
        run: docker compose -f docker-compose.test.yml run --rm integration-tests

      - name: Teardown test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v