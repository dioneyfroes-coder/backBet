name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard de segredos (nenhum segredo no Git — Fase 26)
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests com cobertura
        run: npx jest --maxWorkers=2 --coverage

      - name: Linter
        run: npm run lint

      # Gate duro da Fase 27: nenhuma vulnerabilidade CRÍTICA nas dependências
      # de produção. Moderadas/altas conhecidas: docs/SECURITY-OPS.mdx.
      - name: Scan de dependências (audit crítico - produção)
        run: npm run audit:prod:critical

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  integration:
    runs-on: ubuntu-latest

    # Fase 18 — Ambiente de testes reproduzível: a suíte de integração real
    # (MongoDB replica set + Redis) roda contra a INFRAESTRUTURA VERSIONADA do
    # docker-compose.test.yml, sem depender de MongoDB/Redis pessoais.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Start test infrastructure (MongoDB replica set + Redis)
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 180

      - name: Run real integration tests
        run: npm run test:integration

      - name: Teardown test infrastructure
        run: docker compose -f docker-compose.test.yml down
        if: always()