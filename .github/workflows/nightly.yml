name: Nightly — cargas pesadas

# Fase 16 — CI/CD.
#
# Cargas pesadas NÃO rodam em todo PR (o PR gate é o ci.yml: secrets,
# typecheck, lint, unit, coverage, build, audit critical, integração).
# Este workflow roda os testes pesados que precisam de mais tempo/infra:
#
#   Nightly (agendado 03:00 UTC e manual via workflow_dispatch)
#   ├─ distributed 1x / 5x / 10x   (LOAD_SCALE — 100/500/1000 carteiras)
#   └─ agendados/manuais
#      ├─ Chaos  (crash testing — Fase 14)
#      ├─ Load   (contention — Fase 4)
#      ├─ Backup drill (backup/restore/reconciliação — Fase 15)
#      └─ Docker clean rebuild (reconstrução limpa — Fase 17)
#
# Cada job sobe a SUA própria infra de teste (docker-compose.test.yml:
# MongoDB replica set + Redis) num runner isolado — sem cargas paralelas
# dividindo o mesmo banco. O Docker clean rebuild usa o compose de PRODUÇÃO
# (docker-compose.yml) com LAB_BIND_IP=127.0.0.1 para não depender do IP fixo
# do laboratório.

on:
  schedule:
    # 03:00 UTC todos os dias (01:00 no fuso -03).
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-load:
    name: Load distribuído ${{ matrix.scale }}x
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        scale: [1, 5, 10]
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (backbet:test)
        run: docker compose -f docker-compose.test.yml build integration-tests

      - name: Carga distribuída ${{ matrix.scale }}x
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            -e LOAD_SCALE=${{ matrix.scale }} \
            integration-tests node scripts/run-integration-tests.cjs -- \
            src/integration/__tests__/load.distributed.integration.test.ts

      - name: Teardown test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-rebuild:
    name: Docker clean rebuild (Fase 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Montar .env de laboratório a partir do exemplo
        run: cp .env.example .env

      - name: Drill de reconstrução limpa (down -v → build --no-cache → up → health/readiness)
        run: LAB_BIND_IP=127.0.0.1 npm run docker:rebuild:ci

  scheduled-suite:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Chaos (crash testing — Fase 14)
            spec: src/integration/__tests__/crash.integration.test.ts
          - name: Load (contention — Fase 4)
            spec: src/integration/__tests__/load.concurrency.integration.test.ts
          - name: Backup drill (Fase 15)
            spec: src/integration/__tests__/backup.integration.test.ts
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (backbet:test)
        run: docker compose -f docker-compose.test.yml build integration-tests

      - name: ${{ matrix.suite.name }}
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            integration-tests node scripts/run-integration-tests.cjs -- \
            ${{ matrix.suite.spec }}

      - name: Teardown test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v