# BackBet — configuração do Prometheus (docker-compose.observability.yml)
#
# Habilite /metrics na aplicação com OBS_ENABLE_PROMETHEUS=true no .env.
# O backbet é alcançável pela rede interna do Compose no hostname "backbet".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backbet"
    metrics_path: /metrics
    static_configs:
      - targets: ["backbet:3000"]
        labels:
          service: backbet-backend

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector