# =============================================================================
# BackBet — Compose do ambiente de TESTE
# =============================================================================

name: backbet-test

services:
  mongodb:
    image: mongo:7
    restart: "no"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:37017:27017"
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        URI="mongodb://mongodb:27017/admin?directConnection=true"
        state=$$(mongosh "$${URI}" --quiet --eval 'try { db.adminCommand({ replSetGetStatus: 1 }).myState } catch (e) { 0 }')
        if [ "$${state}" = "1" ]; then
          echo "Replica set rs0 ja iniciado (PRIMARY). Nada a fazer."
          exit 0
        fi
        echo "Iniciando replica set rs0 (membro anunciado em 127.0.0.1:27017)..."
        mongosh "$${URI}" --quiet --eval \
          "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })" >/dev/null 2>&1 || true
        i=0
        while [ "$${i}" -lt 30 ]; do
          state=$$(mongosh "$${URI}" --quiet --eval 'try { db.adminCommand({ replSetGetStatus: 1 }).myState } catch (e) { 0 }')
          if [ "$${state}" = "1" ]; then
            echo "Replica set rs0 PRONTO (myState=1 PRIMARY)."
            exit 0
          fi
          i=$$((i + 1))
          sleep 1
        done
        echo "ERRO: replica set rs0 nao ficou PRIMARY em 30s." >&2
        exit 1

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s

volumes:
  mongo_test_data:
